groups:
  - name: compute-platform
    rules:
      - alert: InferenceRuntimeUnavailable
        expr: platform_service_state{kind=~"rpc-worker|petals-worker|model-server|inference-gateway",state=~"failed|degraded|offline"} == 1
        for: 15s
        labels: { severity: critical }
        annotations:
          summary: "Inference runtime {{ $labels.service }} is {{ $labels.state }}"
      - alert: ControlPlaneCheckpointFailure
        expr: platform_service_state{kind="control-plane",state="degraded"} == 1
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Control plane state checkpoints are failing"
      - alert: LogCollectorUnavailable
        expr: up{job="alloy"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Log collector {{ $labels.instance }} is unavailable"
      - alert: LogDeliveryRetrying
        expr: increase(loki_write_batch_retries_total[5m]) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Log collector cannot deliver batches to Loki reliably"
      - alert: LogEntriesDropped
        expr: increase(loki_write_dropped_entries_total[5m]) > 0
        for: 0s
        labels: { severity: critical }
        annotations:
          summary: "Log collector has discarded entries; inspect Loki and connectivity"
      - alert: InferenceGenerationStalled
        expr: increase(platform_inference_first_token_timeouts_total[5m]) + increase(platform_inference_idle_timeouts_total[5m]) + increase(platform_inference_total_timeouts_total[5m]) > 0
        for: 0s
        labels: { severity: warning }
        annotations:
          summary: "Generation timeout on {{ $labels.deployment }}"
      - alert: InferenceQueueSaturated
        expr: increase(platform_inference_rejected_total[5m]) + increase(platform_inference_queue_timeouts_total[5m]) > 0
        for: 0s
        labels: { severity: warning }
        annotations:
          summary: "Inference capacity exceeded on {{ $labels.deployment }}"
      - alert: InferenceStreamFailure
        expr: increase(platform_inference_failed_total[5m]) > 0
        for: 0s
        labels: { severity: warning }
        annotations:
          summary: "Inference failed, including failures after HTTP headers, on {{ $labels.deployment }}"
      - alert: ControlPlaneUnavailable
        expr: up{job="control-plane"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Control plane metrics cannot be scraped"
      - alert: AgentHeartbeatMissing
        expr: time() - platform_service_last_seen_seconds{kind="agent"} > 35
        for: 15s
        labels: { severity: critical }
        annotations:
          summary: "Agent {{ $labels.node }} stopped reporting"
      - alert: InferenceErrorRateHigh
        expr: sum by (service) (rate(platform_service_errors_total{kind="inference-gateway"}[5m])) / clamp_min(sum by (service) (rate(platform_service_requests_total{kind="inference-gateway"}[5m])), 0.001) > 0.05
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Inference errors exceed 5% for {{ $labels.service }}"
      - alert: ServiceLatencyHigh
        expr: histogram_quantile(0.95, sum by (le,service) (rate(platform_service_request_duration_seconds_bucket{kind="control-plane"}[5m]))) > 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Control plane p95 request latency exceeds 1 second"
